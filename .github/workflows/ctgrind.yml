name: ctgrind

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 18 * * *"

env:
  CARGO_TERM_COLOR: always
  VALGRIND_BUG_494162: 1

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build: ""
          - os: ubuntu-latest
            build: --release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: ctgrind tests
        run: admin/ctgrind ${{ matrix.build }}

  # The arm64 runner executes 32-bit ARM natively, so an armhf valgrind checks
  # the armv7 build (libcrux and fiat-crypto) without emulation.
  armv7:
    name: armv7 (${{ matrix.build || 'debug' }})
    strategy:
      matrix:
        build: ["", --release]

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf

      - name: Install armhf toolchain and valgrind
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf valgrind:armhf

      - name: ctgrind tests
        run: admin/ctgrind --target armv7-unknown-linux-gnueabihf ${{ matrix.build }}
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
