name: Quest

# Validates the quest tree on every branch that carries one. check.yml already
# runs `quest check` on pull requests, but a direct push (a merge to `main`, or
# `main` merged into a quest branch) is nobody's pull request, so a broken tree
# could land there unseen.
#
# The paths mirror the quest module in sh/dispatch.sh's impact map: the
# documents, and flake.lock, which pins the validator.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "quest/**"
    paths:
      - "quest/**"
      - "flake.lock"
      - ".github/workflows/quest.yml"

# Only the newest push to a branch matters.
concurrency:
  group: quest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Not `Check`: that is check.yml's status, and a second job with the same
    # name would make it ambiguous on a head that runs both.
    name: Quest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # The whole tree, unscoped: a push has no base to diff against. Only the
      # quest package, so the job skips building the Rust dev shell.
      - name: Check
        run: nix run .#quest -- check
