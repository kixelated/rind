name: bench

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  VALGRIND_BUG_494162: 1

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-codspeed
        run: cargo binstall -y cargo-codspeed

      - name: Build benchmarks
        run: cargo codspeed build -p rind-bench --features __bench_codspeed

      # CodSpeed refuses a repository it has no token for, so the benchmarks
      # only build until CODSPEED_TOKEN is set.
      - name: Check CodSpeed token
        id: codspeed
        run: |
          if [[ -n "$CODSPEED_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CodSpeed skipped: set the CODSPEED_TOKEN secret."
          fi
        env:
          CODSPEED_TOKEN: ${{ secrets.CODSPEED_TOKEN }}

      - name: Run benchmarks
        if: steps.codspeed.outputs.ready == 'true'
        uses: CodSpeedHQ/action@v3
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
