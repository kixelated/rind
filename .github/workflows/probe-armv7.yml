name: probe-armv7

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: CPU and kernel
        run: |
          uname -a
          lscpu || true
          grep -m1 Features /proc/cpuinfo || true
          grep -m1 'CPU part' /proc/cpuinfo || true
          grep -E 'CONFIG_COMPAT=|CONFIG_ARM64_.*32' /boot/config-$(uname -r) || true
          cat /etc/apt/sources.list.d/* 2>/dev/null | head -30
      - name: Install armhf toolchain and valgrind
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6:armhf valgrind:armhf
      - name: Run armhf binary natively
        run: |
          printf '#include <stdio.h>\nint main(void){puts("hello from armhf");return 0;}\n' > h.c
          arm-linux-gnueabihf-gcc -O1 -o h h.c
          file h
          ./h
      - name: Run armhf valgrind
        run: |
          file $(readlink -f $(which valgrind)) /usr/libexec/valgrind/memcheck-* || true
          valgrind --error-exitcode=99 ./h
