name: Check

permissions:
  contents: read

# The gate `just ci` runs locally, over what the branch changed. A push to
# `main` runs every crate, so a combination of PRs that broke together shows.
# The platform matrix and the deeper suites live in the other workflows.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just ci` can diff against the PR base.
          fetch-depth: 0

      - uses: ./.github/actions/just

      # A query failure fails this job; an empty selection keeps its required
      # name green.
      - name: Select work
        id: scope
        run: just ci-select "$CI_BASE" >> "$GITHUB_OUTPUT"
        env:
          CI_BASE: ${{ github.event_name == 'push' && '--all' || '' }}

      - uses: ./.github/actions/nix
        if: steps.scope.outputs.needed == 'true'

      - uses: ./.github/actions/vectors
        if: steps.scope.outputs.rust == 'true'

      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only `main` writes, so PRs share one warm cache instead of each
          # evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        if: steps.scope.outputs.needed == 'true'
        run: nix develop --command just ci "$CI_BASE"
        env:
          CI_BASE: ${{ github.event_name == 'push' && '--all' || '' }}
