name: scratch-armv7-ctgrind

on:
  push:
    branches:
      - scratch/armv7-ctgrind

env:
  CARGO_TERM_COLOR: never
  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: valgrind --track-origins=yes --error-exitcode=99
  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
  CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
  CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        build: ["", --release]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf
      - run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf valgrind:armhf
          valgrind --version
      - name: build
        run: |
          T="--target armv7-unknown-linux-gnueabihf ${{ matrix.build }}"
          time cargo test $T -p rind --lib --features __ctgrind --no-run 2>&1 | tail -1
          time cargo test $T -p rind --test wycheproof --no-run 2>&1 | tail -1
          time cargo test $T --workspace --exclude rind --lib --test ctgrind --features rind/__ctgrind --no-run 2>&1 | tail -1
      # Only counts and timings: the findings are under private upstream report.
      - name: run
        run: |
          T="--target armv7-unknown-linux-gnueabihf ${{ matrix.build }}"
          q() { grep -E "^test result|^    [a-z_:]+$|ERROR SUMMARY|^real" | sed 's/==[0-9]*==//'; }
          { time cargo test $T -p rind --lib --features __ctgrind --no-fail-fast; } 2>&1 | q || true
          { time cargo test $T -p rind --test wycheproof --no-fail-fast; } 2>&1 | q || true
          { time cargo test $T --workspace --exclude rind --lib --test ctgrind --features rind/__ctgrind --no-fail-fast; } 2>&1 | q || true
