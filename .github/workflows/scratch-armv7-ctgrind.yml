name: scratch-armv7-ctgrind

on:
  push:
    branches:
      - scratch/armv7-ctgrind

env:
  CARGO_TERM_COLOR: never
  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: valgrind --track-origins=yes --error-exitcode=99 --num-callers=40
  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
  CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
  CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        build: ["", --release]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf
      - run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf valgrind:armhf
      - name: lib
        run: time cargo test --target armv7-unknown-linux-gnueabihf ${{ matrix.build }} -p rind --lib --features __ctgrind --no-fail-fast || true
      - name: wycheproof
        run: time cargo test --target armv7-unknown-linux-gnueabihf ${{ matrix.build }} -p rind --test wycheproof --no-fail-fast || true
      - name: adapters
        run: time cargo test --target armv7-unknown-linux-gnueabihf ${{ matrix.build }} --workspace --exclude rind --lib --test ctgrind --features rind/__ctgrind --no-fail-fast || true
