name: build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 18 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rustc: stable
          - os: ubuntu-latest
            rustc: nightly
          - os: macos-latest
            rustc: stable
          - os: windows-latest
            rustc: stable
          - os: ubuntu-latest
            cross: aarch64-unknown-linux-gnu
            rustc: stable

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install ${{ matrix.rustc }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rustc }}

      - name: Install valgrind on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install cross
        if: matrix.cross != ''
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.cross }}

      - name: Build (debug)
        run: cargo build -p rind
      - name: Run tests (debug)
        run: cargo test
      - name: Run tests (debug, --no-default-features)
        run: cargo test --no-default-features

      - name: Build (release)
        run: cargo build -p rind --release
      - name: Run tests (release)
        run: env SLOW_TESTS=1 cargo test --release

      - name: Artificial CPU feature tests (x86_64)
        if: runner.arch == 'X64'
        run: |
          # test software fallbacks for sha256 and sha512
          env RIND_CPU_DISABLE_sha=1 RIND_CPU_DISABLE_bmi2=1 cargo test
          # test avx2/aesni aes-gcm & ML-KEM without avx512
          env RIND_CPU_DISABLE_avx512bw=1 RIND_CPU_DISABLE_avx512f=1 RIND_CPU_DISABLE_vaes=1 cargo test

  # 32-bit ARM runs the libcrux backend. Only rind and its adapters build
  # there: the bench and fuzz crates need C libraries for the host arch.
  armv7:
    name: armv7 (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            test: true
          - target: armv7-linux-androideabi
            test: false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install cross
        if: matrix.test
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build -p rind -p rind-rustls --target ${{ matrix.target }}

      # Tests need dev-dependencies that build C, so only the tested target
      # lints them.
      - name: Clippy
        run: cargo clippy -p rind -p rind-rustls --target ${{ matrix.target }} ${{ matrix.test && '--all-targets' || '' }} -- --deny warnings

      # Under qemu, so optimised, but keeping the checks a debug build has.
      - name: Run tests
        if: matrix.test
        run: cargo test -p rind -p rind-rustls --release --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: true
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: true
