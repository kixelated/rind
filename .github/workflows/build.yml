name: build

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rustc: stable
          - os: ubuntu-latest
            rustc: nightly
          - os: macos-latest
            rustc: stable
          - os: windows-latest
            rustc: stable
          - os: ubuntu-latest
            cross: aarch64-unknown-linux-gnu
            rustc: stable

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - name: Install ${{ matrix.rustc }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rustc }}

      - name: Install valgrind on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install cross
        if: matrix.cross != ''
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.cross }}

      - name: Build (debug)
        run: cargo build -p rind
      - name: Run tests (debug)
        run: cargo test
      - name: Run tests (debug, --no-default-features)
        run: cargo test --no-default-features

      - name: Build (release)
        run: cargo build -p rind --release
      - name: Run tests (release)
        run: env SLOW_TESTS=1 cargo test --release

      - name: Artificial CPU feature tests (x86_64)
        if: runner.arch == 'X64'
        run: |
          # test software fallbacks for sha1 and sha256
          env RIND_CPU_DISABLE_sha=1 cargo test
          # test avx2/aesni aes-gcm & ML-KEM without avx512
          env RIND_CPU_DISABLE_avx512bw=1 RIND_CPU_DISABLE_avx512f=1 RIND_CPU_DISABLE_vaes=1 cargo test

  # 32-bit ARM runs libcrux, or aws-lc's assembly for the crypto extension.
  # The recipe builds and lints Android and Linux gnueabihf, then runs the
  # gnueabihf tests under qemu on both of rind's armv7 paths, as a local run
  # does.
  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors
      - uses: ./.github/actions/just
      - uses: ./.github/actions/nix

      - name: Build, lint, and test
        run: just armv7
