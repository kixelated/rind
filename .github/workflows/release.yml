name: Release

permissions:
  pull-requests: write
  contents: write

# Only one release job can run at a time.
concurrency:
  group: release
  cancel-in-progress: false

# release-plz opens a release PR from `main` and publishes once that PR merges
# (release_always = false in .release-plz.toml), so an ordinary merge never
# publishes on its own.
on:
  push:
    branches:
      - main
    paths:
      - "rind*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".release-plz.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  release:
    name: Plz
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'kixelated' && github.ref == 'refs/heads/main' }}

    steps:
      # A GitHub App token, so the release PR it opens triggers CI; PRs opened
      # with GITHUB_TOKEN do not. Until the app and crates.io credentials are
      # configured, report that and skip rather than fail every push.
      - name: Check credentials
        id: credentials
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release skipped: set the APP_CLIENT_ID, APP_PRIVATE_KEY, and CARGO_REGISTRY_TOKEN secrets."
          fi
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Generate GitHub token
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - uses: ./.github/actions/nix
        if: steps.credentials.outputs.ready == 'true'

      - name: Release
        if: steps.credentials.outputs.ready == 'true'
        run: nix develop --command just release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
