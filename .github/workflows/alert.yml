name: Alert

# Posts nightly, landing, and release failures to the Discord #alerts channel,
# since those runs have no pull request to turn red. Reads the moq-dev
# organization's DISCORD_WEBHOOK secret.

permissions:
  contents: read

on:
  workflow_run:
    # Matched by workflow `name:`, not filename. Only workflows that run outside
    # a pull request. `sh/alert.sh check` enforces the list.
    workflows:
      - asan
      - bench
      - build
      - Check
      - coverage
      - cranelift
      - ctgrind
      - fuzz
      - quality lints
      - Release
      - x86-cpu
    types:
      - completed

# No concurrency group: each run reports a different failed run, and the
# nightlies share a schedule, so cancelling would drop alerts.

jobs:
  discord:
    name: Discord
    # `cancelled` is excluded: a superseded run is cancelled as a matter of
    # course. The nightlies alert only when scheduled, since whoever dispatched
    # one is already watching it. Release and Check alert however they ran:
    # they follow the gate's own pushes, which nobody watches.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      (github.event.workflow_run.event == 'schedule' ||
      contains(fromJSON('["Release", "Check"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_REPO: ${{ github.repository }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: sh/alert.sh discord
