[package]
name = "rind-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
aws-lc-rs = { version = "1.16", features = ["non-fips"], default-features = false }

[dependencies.rind]
path = "../rind"

[[bin]]
name = "sha1"
path = "fuzzer/sha1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sha2"
path = "fuzzer/sha2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aead"
path = "fuzzer/aead.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kx"
path = "fuzzer/kx.rs"
test = false
doc = false
bench = false
