[package]
name = "rind"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/kixelated/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
readme = "README.md"
description = "Pure-Rust cryptography for MoQ, forked from graviola"
categories = ["network-programming", "cryptography"]
rust-version = "1.89"

[features]
default = []
__ctgrind = ["dep:crabgrind"]

[dependencies]
cfg-if = "1"
getrandom = "0.4"
crabgrind = { version = "0.4", optional = true }

# armv7's backend: libcrux's verified portable Rust, with no C or
# intrinsics features enabled.
[target.'cfg(target_arch = "arm")'.dependencies]
libcrux-aes = { version = "0.0.10", default-features = false }
libcrux-chacha20poly1305 = "0.0.10"
libcrux-ed25519 = { version = "0.0.10", default-features = false }
libcrux-hacl-rs = { version = "0.0.6", features = ["alloc"] }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-p256 = { version = "0.0.9", features = ["expose-hacl"] }
libcrux-sha2 = { version = "0.0.9", features = ["expose-hacl"] }
libcrux-traits = "0.0.9"

[dev-dependencies]
aws-lc-rs = { version = "1.16", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips"] }
hex = { version = "0.4", features = ["serde"] }
proptest = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.24.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
