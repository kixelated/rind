[package]
name = "rind"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/moq-dev/rind"
license = "(Apache-2.0 OR ISC OR MIT-0) AND (Apache-2.0 OR ISC OR MIT) AND Apache-2.0 AND ISC"
readme = "README.md"
description = "Pure-Rust cryptography for MoQ, forked from graviola"
categories = ["network-programming", "cryptography"]
rust-version.workspace = true

[features]
default = []
__ctgrind = ["dep:crabgrind"]

[dependencies]
cfg-if = "1"
getrandom = "0.4"
crabgrind = { version = "0.4", optional = true }

# armv7's backend: libcrux's portable Rust, with no C or
# intrinsics features enabled, and fiat-crypto's for P-384, which libcrux
# exports only as ECDH.
[target.'cfg(target_arch = "arm")'.dependencies]
fiat-crypto = { version = "0.3", default-features = false }
libcrux-aes = { version = "0.0.10", default-features = false }
libcrux-ed25519 = { version = "0.0.10", default-features = false }
libcrux-hacl-rs = { version = "0.0.6", features = ["alloc"] }
libcrux-macros = "0.0.4"
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-p256 = { version = "0.0.9", features = ["expose-hacl"] }
libcrux-poly1305 = { version = "0.0.7", features = ["expose-hacl"] }
libcrux-traits = "0.0.9"

# Reads the AArch32 crypto extension's HWCAP2 bits.
[target.'cfg(all(target_arch = "arm", any(target_os = "linux", target_os = "android")))'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
aws-lc-rs = { version = "1.16", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips"] }
# Checks armv7's P-384 arithmetic against s2n-bignum's on the other arches.
fiat-crypto = { version = "0.3", default-features = false }
hex = { version = "0.4", features = ["serde"] }
proptest = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
