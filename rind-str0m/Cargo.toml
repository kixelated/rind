[package]
name = "rind-str0m"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/kixelated/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "str0m CryptoProvider backed by rind"
categories = ["network-programming", "cryptography"]
rust-version = "1.89"
readme = "README.md"
# The str0m provider interface on dimpl 0.9, which `rind-dimpl` targets, is
# unreleased. Publish once a str0m release carries it and these git
# dependencies move to crates.io.
publish = false

[dependencies]
dimpl = { version = "0.9", default-features = false }
rcgen = { version = "0.14", default-features = false }
rind = { version = "0.1.0", path = "../rind" }
rind-dimpl = { version = "0.1.0", path = "../rind-dimpl" }
rind-rcgen = { version = "0.1.0", path = "../rind-rcgen" }
str0m-proto = { git = "https://github.com/algesten/str0m", rev = "dc317173b16fc6ed86633e6b08b229c9195deb87", default-features = false, features = ["dtls"] }
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
str0m = { git = "https://github.com/algesten/str0m", rev = "dc317173b16fc6ed86633e6b08b229c9195deb87", default-features = false }
str0m-aws-lc-rs = { git = "https://github.com/algesten/str0m", rev = "dc317173b16fc6ed86633e6b08b229c9195deb87" }
